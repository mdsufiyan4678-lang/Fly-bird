name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "Error: JAVA_HOME is not set." >&2
            exit 1
          fi
          VERSION_OUTPUT=$(java -version 2>&1 | head -n 1)
          MAJOR_VERSION=$(echo "$VERSION_OUTPUT" | sed -E 's/.*version "([0-9]+).*/\1/')
          if [ -z "$MAJOR_VERSION" ] || ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "Error: Could not detect active Java major version." >&2
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Active Java version ($MAJOR_VERSION) is lower than 17." >&2
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          if [ ! -f "./debug.keystore" ]; then
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be created." >&2
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "Error: Expected APK not found at $APK_PATH" >&2
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK paths inside app/build/outputs/apk:" >&2
              find app/build/outputs/apk -name "*.apk" -print >&2 || true
            fi
            exit 1
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: $APK_PATH is not a regular file." >&2
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: $APK_PATH is empty." >&2
            exit 1
          fi
          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "Error: $APK_PATH does not have the .apk extension." >&2
              exit 1
              ;;
          esac
          if [ "$APK_PATH" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: APK path mismatch." >&2
            exit 1
          fi
          echo "Verified APK: $APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP}/apk-release-XXXXXX")"
          RELEASE_ASSET_PATH="${TEMP_RELEASE_DIR}/app-debug.apk"
          cp "$SOURCE_APK" "$RELEASE_ASSET_PATH"
          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty." >&2
            exit 1
          fi
          echo "asset_path=${RELEASE_ASSET_PATH}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Prepared APK does not exist at $ASSET_PATH" >&2
            exit 1
          fi
          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared APK is empty." >&2
            exit 1
          fi
          ASSET_FILENAME="$(basename "$ASSET_PATH")"
          case "$ASSET_FILENAME" in
            *.apk) ;;
            *)
              echo "Error: Prepared asset does not end in .apk" >&2
              exit 1
              ;;
          esac
          if [ "$ASSET_FILENAME" != "app-debug.apk" ]; then
            echo "Error: Release asset filename must be exactly app-debug.apk" >&2
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES="Automatically generated debug APK built by GitHub Actions.

          - **GitHub Actions Run Number:** ${GITHUB_RUN_NUMBER}
          - **GitHub Actions Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **Purpose:** Intended for testing only (not a Play Store production release).
          - **Signing:** Signed only with a temporary debug keystore."

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_TAG="${{ steps.publish_release.outputs.release_tag }}"
            RELEASE_TITLE="${{ steps.publish_release.outputs.release_title }}"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url)
            DIRECT_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: ${DIRECT_APK_URL}"
            echo "Backup Artifact: Normal Actions artifact 'app-debug-apk' remains available as a backup."

            {
              echo "### DIRECT APK DOWNLOAD"
              echo "${DIRECT_APK_URL}"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Page:** ${RELEASE_URL}"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo "- **Backup Artifact:** The normal GitHub Actions artifact \`app-debug-apk\` remains available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing failed."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK build succeeded and the GitHub Actions artifact named 'app-debug-apk' remains available."
            fi
            {
              echo "### WARNING: GitHub Release Publishing Failed"
              echo "The APK build succeeded and the normal GitHub Actions artifact \`app-debug-apk\` remains available for download from this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
